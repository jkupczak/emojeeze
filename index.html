<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and copy emoji, compose with Write with Emoji, and play Activities like Memory Match. Fast, keyboard-friendly, and works offline."
    />
    <meta name="theme-color" content="#0c0e12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emojeeze" />
    <link rel="canonical" href="https://emojeeze.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emojeeze" />
    <meta property="og:url" content="https://emojeeze.com/" />
    <meta property="og:title" content="Emojeeze — find & copy emoji fast" />
    <meta
      property="og:description"
      content="Search and copy emoji, write with emoji, and play Activities—all in one fast, offline-friendly app."
    />
    <meta property="og:image" content="https://emojeeze.com/icon-192.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Emojeeze — find & copy emoji fast" />
    <meta
      name="twitter:description"
      content="Search and copy emoji, write with emoji, and play Activities—all in one fast, offline-friendly app."
    />
    <meta name="twitter:image" content="https://emojeeze.com/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Emojeeze — emoji copy, write & activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to emoji</a>

    <div id="settings-overlay" class="settings-overlay" hidden>
      <div
        id="settings-dialog"
        class="settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        tabindex="-1"
      >
        <h2 id="settings-title" class="settings-dialog__title">Settings</h2>

        <section class="settings-section">
          <h3 class="settings-section__title">Categories</h3>
          <p class="settings-section__hint">Hide whole groups (e.g. Flags) from browse and search.</p>
          <div id="settings-categories" class="settings-categories"></div>
        </section>

        <section class="settings-section">
          <h3 class="settings-section__title">Hidden emoji</h3>
          <p class="settings-section__hint">Paste an emoji or type a name, then add. Unhide anytime.</p>
          <div class="settings-add-row">
            <input
              id="settings-emoji-input"
              class="settings-input"
              type="text"
              placeholder="e.g. 😀 or grinning"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="settings-emoji-add" type="button" class="settings-btn settings-btn--secondary">
              Add
            </button>
          </div>
          <p id="settings-emoji-error" class="settings-error" hidden></p>
          <ul id="settings-hidden-emojis" class="settings-hidden-list"></ul>
        </section>

        <div class="settings-actions">
          <button id="settings-cancel" type="button" class="settings-btn settings-btn--secondary">
            Cancel
          </button>
          <button id="settings-save" type="button" class="settings-btn settings-btn--primary">Save</button>
        </div>
      </div>
    </div>

    <aside id="ad-rail" class="ad-rail" aria-label="Advertisement" hidden>
      <p class="ad-rail__label">Ad</p>
      <div class="ad-rail__slot">
        <!-- Replace IDs in ads-config.js — vertical display unit (160×600) recommended -->
        <ins
          id="adsense-unit"
          class="adsbygoogle"
          style="display: inline-block; width: 160px; height: 600px"
          data-ad-format="vertical"
          data-full-width-responsive="false"
        ></ins>
      </div>
    </aside>

    <header class="search-header">
      <div class="search-header__inner">
        <div class="overflow-menu">
          <button
            id="overflow-menu-btn"
            type="button"
            class="overflow-menu__trigger"
            aria-label="Open menu"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="overflow-menu-panel"
          >
            <span class="overflow-menu__icon" aria-hidden="true"></span>
          </button>
          <div id="overflow-menu-panel" class="overflow-menu__panel" role="menu" hidden>
            <button type="button" class="overflow-menu__item" role="menuitem" data-app-view="copy">
              Copy an Emoji
            </button>
            <button type="button" class="overflow-menu__item" role="menuitem" data-app-view="activities">
              Activities
            </button>
            <button type="button" class="overflow-menu__item" role="menuitem" data-app-view="write">
              Write with Emoji
            </button>
            <button
              type="button"
              id="overflow-open-settings"
              class="overflow-menu__item"
              role="menuitem"
            >
              Settings
            </button>
          </div>
        </div>
        <div id="search-header-primary" class="search-header__primary">
          <input
            id="search"
            class="search-input"
            type="search"
            placeholder="Search emoji… (try :joy: or :thumbs_up:)"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search emoji"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="search-preview catalog"
          />
          <div class="header-controls">
            <div
              id="skin-tone-picker"
              class="skin-tone-picker"
              role="group"
              aria-label="Skin tone"
            ></div>
          </div>
        </div>
      </div>
      <ul id="search-preview" class="search-preview" role="listbox" aria-label="Top matches" hidden></ul>
    </header>

    <section id="activities-hub" class="activities-hub activities-hub--page" hidden aria-label="Activities">
      <h1 class="activities-hub__title">Activities</h1>
      <div id="activities-hub-grid" class="activities-hub__grid"></div>
    </section>

    <div id="memory-match-root" class="memory-match-root" hidden></div>

    <div id="app-content" class="app-content">
      <section id="write-view" class="write-view" hidden aria-label="Write with emoji">
        <label for="write-editor" class="visually-hidden">Your message</label>
        <textarea
          id="write-editor"
          class="write-editor"
          placeholder="Write anything here… tap emoji below to insert them."
          spellcheck="true"
        ></textarea>
      </section>

      <main id="main" class="main" tabindex="-1">
      <p id="results-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>

      <section id="your-lists-section" class="emoji-section" hidden>
        <h2 class="section-title">From your lists</h2>
        <div
          id="your-lists-grid"
          class="emoji-grid emoji-grid--list"
          role="listbox"
          aria-label="Matching emoji from favorites and recent"
        ></div>
      </section>

      <section id="favorites-section" class="emoji-section" hidden>
        <h2 class="section-title">Favorites</h2>
        <div
          id="favorites-grid"
          class="emoji-grid emoji-grid--list"
          role="listbox"
          aria-label="Favorite emoji"
        ></div>
      </section>

      <section id="recent-section" class="emoji-section">
        <div class="section-heading-row">
          <h2 class="section-title section-title--inline">Recent</h2>
          <button id="clear-recent" type="button" class="text-btn">Clear recent</button>
        </div>
        <div
          id="recent-grid"
          class="emoji-grid emoji-grid--list"
          role="listbox"
          aria-label="Recent emoji"
        ></div>
      </section>

      <p id="status" class="status" aria-hidden="true"></p>

      <section id="search-results-section" class="emoji-section" hidden>
        <h2 id="search-results-heading" class="section-title">Search results</h2>
        <div id="search-results-host" class="catalog-grid-host"></div>
      </section>

      <div id="catalog" class="catalog" aria-label="Emoji catalog"></div>

      <section id="activities-inline" class="activities-hub activities-hub--inline" aria-label="Activities & tools">
        <h2 class="section-title">Activities & tools</h2>
        <div id="activities-inline-grid" class="activities-hub__grid"></div>
      </section>
      </main>
    </div>

    <div id="emoji-action-overlay" class="emoji-action-overlay" hidden>
      <div class="emoji-action-panel" role="dialog" aria-modal="true" aria-labelledby="emoji-action-title">
        <div id="emoji-action-display" class="emoji-action-display" aria-hidden="true"></div>
        <p id="emoji-action-title" class="emoji-action-title"></p>
        <div id="emoji-action-menu" class="emoji-action-menu" role="menu"></div>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="assertive" hidden></div>

    <script type="module" src="app.js"></script>
    <script type="module" src="ads.js"></script>
  </body>
</html>
